onboarding = false
# herdr configuration
# 심링크 위치: ~/.config/herdr/config.toml
# 전체 기본값은 `herdr --default-config` 로 확인.
#
# 키 바인딩은 Prefix Ctrl-a 기반으로 손에 익은 배치로 맞춤.

[keys]
# Prefix 키를 Ctrl-a 로 (herdr 기본값은 ctrl+b)
prefix = "ctrl+a"

# --- herdr 기본 바인딩 (의도를 고정하기 위해 명시) ---
new_tab = "prefix+c"              # 새 tab
next_tab = "prefix+n"             # 다음 tab
previous_tab = "prefix+p"         # 이전 tab
switch_tab = "prefix+1..9"        # 번호로 tab 선택
focus_pane_left = "prefix+h" 
focus_pane_down = "prefix+j" 
focus_pane_up = "prefix+k" 
focus_pane_right = "prefix+l"
close_pane = "prefix+x"           # 패널 닫기
zoom = "prefix+z"                 # 패널 확대(줌)

# --- herdr 기본값에서 변경한 바인딩 ---
# split 은 구분선 모양과 키 모양이 일치하도록 배치.
split_vertical = "prefix+|"       # 좌우 분할(세로 구분선)
split_horizontal = "prefix+minus" # 상하 분할(가로 구분선)
new_workspace = "prefix+shift+s"  # 새 workspace(herdr 기본 prefix+shift+n)
reload_config = "prefix+r"        # 설정 리로드(herdr 기본 prefix+shift+r)
# reload_config 가 prefix+r 을 가져가므로 resize_mode 를 옮김(herdr 기본 prefix+r)
# Worktrunk 원격 브랜치 선택기에 prefix+shift+r 을 양보.
resize_mode = "prefix+shift+e"

# --- 네비게이션과 설정 ---
# goto 는 세션 네비게이터를 여는 액션. settings 보다 자주 써서 s 자리를 goto 에 양보.
goto = "prefix+s"
# settings 는 s 자리에서 prefix+comma 로 이동. (쉼표는 named punctuation "comma" 로 표기)
settings = "prefix+comma"

# --- 추가 재배치 ---
# detach: herdr 기본 prefix+q → prefix+d 로 이동. prefix+q 는 비워둠.
detach = "prefix+d"
# previous/next_agent: 대괄호 키를 에이전트 네비게이션에 배치.
previous_agent = "prefix+["
next_agent = "prefix+]"

# --- herdr 기본값 덮어쓰기 ---
# close_tab: herdr 기본 prefix+shift+x → prefix+ampersand.
close_tab = "prefix+ampersand"
# rename_workspace: herdr 기본 prefix+shift+w → prefix+$(shift+4).
rename_workspace = "prefix+shift+4"
# last_pane: 액션은 있으나 기본 미설정 → prefix+;(직전 패널 전환).
last_pane = "prefix+;"
# cycle_pane_next: herdr 기본 prefix+tab → prefix+o(다음 패널 순환).
# prefix+o 자리의 open_notification_target 은 충돌 회피용으로 shift+o 로 이동.
cycle_pane_next = "prefix+o"
open_notification_target = "prefix+shift+o"

# Worktrunk 제거 액션에 prefix+shift+d 를 양보하고 workspace 닫기를 옮김.
close_workspace = "prefix+shift+x"

# Worktrunk 플러그인 worktree 선택기와 제거 액션

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "Worktree: switch / create from local or remote branches"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[ui]
# 에이전트 패널을 space(workspace) 기준으로 그룹핑 (herdr 초기 설정에서 이관)
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "herdr"
